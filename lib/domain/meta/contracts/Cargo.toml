[package]
name = "refractive_swan_contracts"
version.workspace = true
edition.workspace = true

[dependencies]
refractive_swan_core = { path = "../../core" }
refractive_swan_eval = { path = "../evaluation" }
refractive_swan_ingestion = { path = "../ingestion" }
refractive_swan_pipeline = { path = "../pipeline" }
refractive_swan_observability = { path = "../../../platform/meta/observability" }
refractive_swan_mapping = { path = "../../ontologies/mapping" }
refractive_swan_terminology = { path = "../../ontologies/terminology" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { version = "0.8.21", features = ["derive"] }
tempfile = "3.10"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1.18.1", features=["v4", "serde"] }

[[bin]]
name = "contracts-schema"
path = "src/bin/contracts_schema.rs"
