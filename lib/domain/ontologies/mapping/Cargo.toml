[package]
name = "refractive_swan_mapping"
version.workspace = true
edition.workspace = true

[dependencies]
refractive_swan_terminology = { path = "../terminology" }
refractive_swan_core = { path = "../../core" }
refractive_swan_eval = { path = "../../meta/evaluation", features = ["eval-advanced"] }
refractive_swan_vector_port = { path = "../../ports/data/data-store/vector" }
refractive_swan_observability = { path = "../../../platform/meta/observability" }
refractive_swan_compliance = { path = "../../../platform/meta/compliance" }
serde.workspace = true
serde_json.workspace = true
once_cell.workspace = true

[features]
default = ["eval-advanced", "obo-graph"]
eval-advanced = ["refractive_swan_eval/eval-advanced"]
obo-graph = ["refractive_swan_terminology/obo-graph"]
