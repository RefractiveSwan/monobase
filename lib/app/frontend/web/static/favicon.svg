<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffcc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#020617"/>
  
  <!-- Simplified swan - bold and clear at small sizes -->
  <g transform="translate(6, 6)">
    <!-- Swan body - simple teardrop shape -->
    <ellipse cx="12" cy="10" rx="8" ry="7" fill="url(#faviconGrad)"/>
    
    <!-- Swan neck - simple curve -->
    <path d="M 12 6 Q 8 8, 6 14" 
          stroke="url(#faviconGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Swan head - simple circle -->
    <circle cx="5" cy="16" r="2.5" fill="url(#faviconGrad)"/>
  </g>
</svg>
