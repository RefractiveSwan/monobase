<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="swanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffcc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Swan Icon with fluorescent gradient -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Swan body - elegant curves suggesting refraction -->
    <path d="M 20 5 Q 25 0, 30 5 Q 28 15, 25 20 L 15 20 Q 12 15, 10 10 Q 12 7, 20 5 Z" 
          fill="url(#swanGradient)" stroke="#020617" stroke-width="0.5"/>
    <!-- Swan neck - flowing curve -->
    <path d="M 20 5 Q 15 8, 12 15 Q 11 18, 10 22" 
          stroke="url(#swanGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Swan head -->
    <circle cx="9" cy="24" r="3" fill="url(#swanGradient)"/>
    <!-- Accent lines suggesting light refraction -->
    <path d="M 22 10 L 26 14 M 18 12 L 22 16" 
          stroke="#00ffcc" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  </g>
  
  <!-- Text "Refractive Swan" -->
  <text x="55" y="35" font-family="Merriweather, serif" font-size="18" font-weight="700" fill="#020617">
    Refractive Swan
  </text>
  
  <!-- Subtle fluorescent accent under text -->
  <line x1="55" y1="40" x2="190" y2="40" stroke="#00ffcc" stroke-width="1" opacity="0.3"/>
</svg>
