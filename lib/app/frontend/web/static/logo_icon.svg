<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffcc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:0.8" />
    </linearGradient>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGradient">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bgGradient)"/>
  
  <!-- Swan Icon with gradient and glow -->
  <g transform="translate(25, 25)" filter="url(#iconGlow)">
    <!-- Swan body - geometric elegant shape -->
    <path d="M 25 10 Q 35 5, 40 15 Q 38 25, 35 35 L 20 35 Q 15 25, 12 20 Q 15 12, 25 10 Z" 
          fill="url(#iconGradient)" opacity="0.9"/>
    
    <!-- Swan neck - flowing S-curve suggesting refraction -->
    <path d="M 25 10 Q 18 15, 15 25 Q 14 32, 12 40" 
          stroke="url(#iconGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Swan head -->
    <circle cx="10" cy="43" r="5" fill="url(#iconGradient)"/>
    
    <!-- Light refraction accent lines -->
    <path d="M 28 18 L 35 24 M 23 20 L 30 26 M 26 24 L 32 30" 
          stroke="#00ffcc" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/>
    
    <!-- Additional glow accent -->
    <circle cx="30" cy="22" r="15" fill="#00ffcc" opacity="0.1"/>
  </g>
</svg>
