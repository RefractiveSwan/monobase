[package]
name = "refractive_swan_cli"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "map_bundles"
path = "src/bin/map_bundles.rs"

[[bin]]
name = "map_codes"
path = "src/bin/map_codes.rs"

[[bin]]
name = "eval_mapping"
path = "src/bin/eval_mapping.rs"

[[bin]]
name = "validate_fhir"
path = "src/bin/validate_fhir.rs"

[[bin]]
name = "load_datamart"
path = "src/bin/load_datamart.rs"

[[bin]]
name = "build_vector_index"
path = "src/bin/build_vector_index.rs"

[dependencies]
refractive_swan_core = { path = "../../../domain/core" }
refractive_swan_pipeline = { path = "../../../domain/meta/pipeline" }
refractive_swan_mapping = { path = "../../../domain/ontologies/mapping" }
refractive_swan_ingestion = { path = "../../../domain/meta/ingestion" }
refractive_swan_observability = { path = "../../../platform/meta/observability" }
refractive_swan_configuration = { path = "../../../platform/meta/configuration" }
refractive_swan_eval = { path = "../../../domain/meta/evaluation" }
refractive_swan_datamart = { workspace = true }
refractive_swan_vector_store = { workspace = true }
refractive_swan_compliance = { path = "../../../platform/meta/compliance" }
refractive_swan_cli_dto = { path = "../../../dto/cli" }
serde.workspace = true
serde_json.workspace = true 
reqwest = { workspace = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
env_logger = "0.11"
log = "0.4"
clap.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
sqlx = { version = "0.7.4", default-features = false, features = ["runtime-tokio", "macros", "sqlite"] }

[features]
backend-pgvector = ["refractive_swan_vector_store/backend-pgvector"]
