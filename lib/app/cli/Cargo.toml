[package]
name = "dfps_cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "map_bundles"
path = "src/bin/map_bundles.rs"

[[bin]]
name = "map_codes"
path = "src/bin/map_codes.rs"

[[bin]]
name = "eval_mapping"
path = "src/bin/eval_mapping.rs"

[[bin]]
name = "validate_fhir"
path = "src/bin/validate_fhir.rs"

[[bin]]
name = "load_datamart"
path = "src/bin/load_datamart.rs"

[[bin]]
name = "build_vector_index"
path = "src/bin/build_vector_index.rs"

[dependencies]
dfps_core = { path = "../../domain/core" }
dfps_pipeline = { path = "../../domain/pipeline" }
dfps_mapping = { path = "../../domain/ontologies/mapping" }
dfps_ingestion = { path = "../../domain/ontologies/ingestion" }
dfps_observability = { path = "../../platform/observability" }
dfps_configuration = { path = "../../platform/configuration" }
dfps_eval = { path = "../../domain/evaluation/eval" }
dfps_datamart = { path = "../web/backend/datamart" }
dfps_vector_store = { path = "../../platform/vector_store" }
dfps_compliance = { path = "../../platform/compliance" }
dfps_terminology = { path = "../../domain/ontologies/terminology" }
serde.workspace = true
serde_json.workspace = true 
reqwest = { workspace = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
env_logger = "0.11"
log = "0.4"
clap.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
sqlx = { version = "0.7.4", default-features = false, features = ["runtime-tokio", "macros", "sqlite"] }

[features]
backend-pgvector = ["dfps_vector_store/backend-pgvector"]
