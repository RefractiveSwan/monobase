[package]
name = "dfps_api"
version.workspace = true
edition.workspace = true

[lib]
name = "dfps_api"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
log = "0.4"
env_logger = "0.11"
thiserror = "2.0.17"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sqlx = { version = "0.7.4", default-features = false, features = ["runtime-tokio", "sqlite"] }
dfps_core = { path = "../../../domain/core" }
dfps_pipeline = { path = "../../../domain/meta/pipeline" }
dfps_observability = { path = "../../../platform/meta/observability" }
dfps_configuration = { path = "../../../platform/meta/configuration" }
dfps_mapping = { path = "../../../domain/ontologies/mapping" }
dfps_eval = { path = "../../../domain/meta/evaluation" }
dfps_datamart = { path = "../datamart" }
dfps_compliance = { path = "../../../platform/meta/compliance" }
dfps_terminology = { path = "../../../domain/ontologies/terminology" }
dfps_vector_store = { path = "../vector_store" }
dfps_contracts = { path = "../../../domain/meta/contracts" }
dfps_web_dto = { path = "../../../dto/web" }
