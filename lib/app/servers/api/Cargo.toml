[package]
name = "refractive_swan_api"
version.workspace = true
edition.workspace = true

[lib]
name = "refractive_swan_api"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
log = "0.4"
env_logger = "0.11"
thiserror = "2.0.17"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
sha2 = "0.10"
sqlx = { version = "0.7.4", default-features = false, features = ["runtime-tokio", "sqlite"] }
refractive_swan_core = { path = "../../../domain/core" }
refractive_swan_pipeline = { path = "../../../domain/meta/pipeline" }
refractive_swan_observability = { path = "../../../platform/meta/observability" }
refractive_swan_configuration = { path = "../../../platform/meta/configuration" }
refractive_swan_mapping = { path = "../../../domain/ontologies/mapping" }
refractive_swan_eval = { path = "../../../domain/meta/evaluation" }
refractive_swan_datamart = { workspace = true }
refractive_swan_compliance = { path = "../../../platform/meta/compliance" }
refractive_swan_terminology = { path = "../../../domain/ontologies/terminology" }
refractive_swan_mesh_node = { path = "../../../platform/mesh/node" }
refractive_swan_mesh_dto = { path = "../../../dto/mesh" }
refractive_swan_contracts = { path = "../../../domain/meta/contracts" }
refractive_swan_web_dto = { path = "../../../dto/web" }
