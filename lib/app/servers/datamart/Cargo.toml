[package]
name = "dfps_datamart"
version.workspace = true
edition.workspace = true

[dependencies]
dfps_core = { path = "../../../domain/core" }
dfps_pipeline = { path = "../../../domain/meta/pipeline" }
dfps_configuration = { path = "../../../platform/meta/configuration" }
dfps_compliance = { path = "../../../platform/meta/compliance" }
dfps_terminology = { path = "../../../domain/ontologies/terminology" }
dfps_contracts = { path = "../../../domain/meta/contracts" }
dfps_datamart_port = { path = "../../../domain/ports/data/data-plane/datamart" }
async-trait = "0.1"
serde.workspace = true
sqlx = { version = "0.7.4", default-features = false, features = ["runtime-tokio", "macros", "sqlite"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
